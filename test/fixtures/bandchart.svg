 y="378" text-anchor="start">21.025</text><text x="196.44444444444417" y="378" text-anchor="middle">21.200</text><text x="249.11111111111043" y="378" text-anchor="middle">21.275</text><text x="372" y="378" text-anchor="end">21.450</text><text x="48" y="410" text-anchor="end" class="bname">12 m</text><rect x="56" y="398" width="316" height="14" rx="2" fill="var(--line)"/><rect x="56" y="398" width="126.4" height="14" fill="var(--amber)"/><rect x="182.4" y="398" width="189.6" height="14" fill="var(--ok)"/><text x="56" y="424" text-anchor="start">24.890</text><text x="182.4" y="424" text-anchor="middle">24.930</text><text x="372" y="424" text-anchor="end">24.990</text><text x="48" y="456" text-anchor="end" class="bname">10 m</text><rect x="56" y="444" width="316" height="14" rx="2" fill="var(--line)"/><rect x="56" y="444" width="55.7647058823531" height="14" fill="var(--amber)"/><rect x="111.7647058823531" y="444" width="260.2352941176469" height="14" fill="var(--ok)"/><text x="56" y="470" text-anchor="start">28.000</text><text x="111.7647058823531" y="470" text-anchor="middle">28.300</text><text x="372" y="470" text-anchor="end">29.700</text></svg><p>Frequencies in MHz, each band on its own scale. 160 meters allows every mode anywhere. 30 meters is CW, RTTY and data only, 200 W PEP. 60 meters is four channels (centred on 5.332, 5.348, 5.373 and 5.405 MHz; USB, CW and data; 100 W ERP, 2.8 kHz) plus a small band at 5.3515 to 5.3665 MHz. Everywhere else the limit is 1500 W PEP. Beacons: 28.200 to 28.300 MHz, 100 W; propagation beacons at 14.100, 18.110, 21.150, 24.930 and 28.200 MHz. 10 meter repeaters above 29.5 MHz. Voice: LSB on 160, 75 and 40 meters, USB from 20 meters up and on 60 meters.</p>