<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Technician drills</title>
<meta name="theme-color" content="#EDF0F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11171D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
:root{
  --bg:#EDF0F2;--panel:#FFFFFF;--ink:#18232E;--muted:#56636F;--line:#CBD3DA;
  --amber:#B8730F;--amber-bg:#FBF0DD;--ok:#22744A;--ok-bg:#E2F2E8;--bad:#A93434;--bad-bg:#F8E3E3;
  --none:#B9C2CA;--bronze:#A8632B;--silver:#4A80A8;--gold:#C8930E;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#11171D;--panel:#1A222A;--ink:#E3E8ED;--muted:#9AA7B3;--line:#2D3842;
  --amber:#E9A33E;--amber-bg:#33270F;--ok:#5CC48A;--ok-bg:#163223;--bad:#EE7B7B;--bad-bg:#3A1B1B;
  --none:#4A5661;--bronze:#C9864A;--silver:#7FB6E0;--gold:#EBC04E;
  color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:34px;line-height:1.05;margin:4px 0 6px;letter-spacing:.01em}
.sub{color:var(--muted);margin:0 0 8px;font-size:15px}
.over{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:500;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);margin:14px 0 0}
.facts{list-style:none;margin:0 0 18px;padding:0;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:2px 14px}
.facts b{font-weight:400;color:var(--ink)}
.back{font:inherit;font-size:15px;background:none;border:0;padding:6px 0;margin:0 0 4px;color:var(--muted);cursor:pointer}
/* home */
.today{display:flex;align-items:baseline;gap:12px;margin:6px 0 4px}
.today b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:72px;line-height:.9;color:var(--amber)}
.today span{font-size:17px}
.reach{color:var(--muted);font-size:15px;margin:0 0 14px}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:15px}
.plan p{margin:0}.plan p+p{margin-top:6px}
.plan b{font-weight:700}
.plan .pass b{color:var(--ok)}.plan .short b{color:var(--bad)}
.plan .muted{color:var(--muted);font-size:14px}
.plan a,.plan .linkbtn{color:var(--muted);font-size:14px}
.plan .set{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:8px}
.plan input[type=date]{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color-scheme:inherit}
.plan .links{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px}
.decks{list-style:none;margin:18px 0 0;padding:0;border-top:1px solid var(--line)}
.decks li{border-bottom:1px solid var(--line)}
.row{font:inherit;color:inherit;background:none;border:0;width:100%;text-align:left;display:grid;grid-template-columns:104px 1fr auto;gap:2px 10px;align-items:center;padding:12px 2px;cursor:pointer}
.row .code{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:500;font-size:34px;line-height:1;color:var(--amber);grid-row:span 2}
.row .nm{font-weight:700;font-size:17px;line-height:1.25}
.row .meta{font-size:14px;color:var(--muted);grid-column:2}
.row .due{grid-row:span 2;grid-column:3;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:26px;line-height:1;text-align:right;min-width:44px}
.row .due small{display:block;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:400;font-size:12px;color:var(--muted)}
.row .due.zero{color:var(--muted)}
.meter{grid-column:2/4;height:4px;border-radius:2px;background:var(--line);overflow:hidden;display:flex;margin-top:6px}
.meter i{display:block;height:100%}
.meter .m{background:var(--ok)}.meter .s{background:var(--amber)}
.untouched .code{color:var(--muted)}
.row .code{display:flex;align-items:center;gap:5px}
.row .code.long{font-size:28px}
.row.badged .code{color:var(--muted)}
/* badges: a tower with one, two or three signal arcs for bronze, silver, gold; gold also broadcasts two waves out past the ring */
.badge{display:block;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.badge .ring{fill:var(--panel);stroke:currentColor;stroke-width:3}
.badge.t0{color:var(--none)}.badge.t0 .ring{stroke-dasharray:4 3}.badge.t0 .tw{stroke-dasharray:3 2.5}
.badge.t1{color:var(--bronze)}.badge.t2{color:var(--silver)}.badge.t3{color:var(--gold)}
.badge.lapsed{opacity:.45}
.sashbox{margin:22px 0 0;padding:14px 8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.sash{list-style:none;display:grid;grid-template-columns:repeat(6,1fr);gap:10px 4px;margin:0;padding:0}
.sash li{text-align:center}
.sash .badge{margin:0 auto}
.sash b{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:17px;line-height:1.2;margin-top:3px}
.sash .lapsed+b{color:var(--muted)}
.sash-cap{font-size:14px;color:var(--muted);margin:10px 6px 0;text-align:center}
.section-gap{margin-top:8px}
/* drill */
.groups{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.optsbox{margin:0 0 12px}
.optsbox summary{cursor:pointer;font-size:14px;color:var(--muted);list-style:none;display:inline-flex;align-items:center;gap:6px}
.optsbox summary::-webkit-details-marker{display:none}
.optsbox summary::before{content:"";width:0;height:0;border:5px solid transparent;border-left:7px solid var(--muted);border-right:0;transition:transform .15s}
.optsbox[open] summary::before{transform:rotate(90deg)}
.optsbox .opts{margin:10px 0 2px}
.opts{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:15px;color:var(--muted);margin-bottom:14px}
.opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.opts input{width:18px;height:18px;accent-color:var(--amber)}
.srs{font-size:15px;margin:0 0 10px}
.status{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px;color:var(--muted);margin-bottom:6px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:16px}
.bar span{display:block;height:100%;background:var(--amber);width:0;transition:width .25s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px 20px}
.qid{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:17px;letter-spacing:.04em;color:var(--amber);margin-right:6px}
.topic{font-size:14px;color:var(--muted);margin:0 0 12px}
.fig{background:var(--amber-bg);border-radius:8px;padding:8px 12px;font-size:15px;margin:0 0 12px}
.q{font-size:21px;font-weight:700;line-height:1.35;margin:0 0 16px}
.ans{display:flex;flex-direction:column;gap:8px}
.ans button{font:inherit;text-align:left;display:flex;gap:10px;align-items:flex-start;width:100%;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer}
.ans button b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:19px;min-width:16px;line-height:1.35}
.ans button:disabled{cursor:default}
.ans button.right{background:var(--ok-bg);border-color:var(--ok)}
.ans button.wrong{background:var(--bad-bg);border-color:var(--bad)}
.note{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:16px}
.note strong.ok{color:var(--ok)}.note strong.no{color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:11px 18px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.explain{margin-top:14px;border-left:3px solid var(--amber);padding:2px 0 2px 14px}
.explain p{margin:0 0 10px;font-size:16px}
.explain details{margin-top:6px;font-size:15px}
.explain summary{cursor:pointer;color:var(--muted)}
.explain details p{font-size:15px;margin:8px 0 0}
.fx{background:var(--amber-bg);border-radius:10px;padding:10px 14px;margin:12px 0 0}
.fx .eq{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:26px;margin:0}
.fx .leg{margin:6px 0 0;padding-left:18px;font-size:15px}.fx .leg li{margin:2px 0}
.cheat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 16px;font-size:15px}
.cheat summary{cursor:pointer;font-weight:700}.cheat p{margin:8px 0 0}
.study h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:28px;line-height:1.1;color:var(--amber);margin:26px 0 6px}
.study h2:first-of-type{margin-top:10px}
.study .cover{font-size:14px;color:var(--muted);margin:4px 0 0}
.study .cover a{color:inherit}
.study .cover b{font-weight:400;color:var(--ink)}
.study .sec{margin:34px 0 0;padding-top:18px;border-top:1px solid var(--line)}
.study .sec:first-of-type{margin-top:0;padding-top:0;border-top:0}
.study .sec h1{margin-top:0}
.study .gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.study .gallery div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.study .gallery svg{width:100%;height:auto;color:var(--ink);display:block;margin-bottom:4px}
.study .gallery b{display:block;font-size:16px}
.study .gallery p{margin:4px 0 0;color:var(--muted)}
.study .cheat{margin-top:12px}
.study .cheat summary{display:none}
.study .cheat p{margin:0 0 8px}
.study .cheat p:first-of-type{margin-top:0}
.tools{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:15px;margin:0 0 14px}
.tools a,.tools .linkbtn{font-size:15px;color:var(--muted)}
.study-link{display:block;font-size:14px;color:var(--muted);padding:0 2px 12px 104px;margin-top:-6px}
.row .due.zero{color:var(--line)}
.study-link a{color:inherit}
.only{font-size:15px;color:var(--muted);margin:0 0 14px}
.only a{color:inherit}
@media print{
  body{background:#fff;color:#000;font-size:12pt}
  .back,.tools,.actions,.btn,.linkbtn,.foot,.toast{display:none!important}
  .study .cover a{text-decoration:none}
  .study .sec{break-before:page;border-top:0;margin-top:0;padding-top:0}
  .study .sec:first-of-type{break-before:auto}
  .study h2{break-after:avoid}.study .gallery div,.study .primer p{break-inside:avoid}
  .study .cover a{display:none}
  .study .cheat,.study .gallery div{border-color:#999}
  a[href]::after{content:none}
}
.ptitle{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:32px;line-height:1.1;color:var(--amber);margin:0 0 8px}
.primer p{margin:0 0 10px}
.end h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:56px;line-height:1;margin:0;color:var(--amber)}
.end p{margin:6px 0 0}
/* symbols */
.prompt{font-size:15px;color:var(--muted);margin:0 0 6px}
.name{font-size:22px;font-weight:700;margin:0 0 14px}
.big{display:flex;justify-content:center;margin:6px 0 16px}
.big svg{width:min(100%,260px);height:auto;color:var(--ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles button{justify-content:center;padding:14px 8px}
.tiles svg{width:100%;max-width:150px;height:auto;color:var(--ink)}
.defn{margin:0 0 6px}.hook{margin:0;color:var(--muted);font-size:15px}
/* footer */
.foot{font-size:14px;color:var(--muted);margin-top:28px}
.foot .links{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
.foot .links a{color:inherit}
.about h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:24px;color:var(--amber);margin:22px 0 4px}
.about p{margin:0 0 10px}
.about a{color:inherit}
.foot p{margin:0 0 8px}
.linkbtn{font:inherit;font-size:14px;background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);box-shadow:0 4px 18px rgba(0,0,0,.25);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;max-width:90vw;pointer-events:none}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.bar span{transition:none}}
</style>
</head>

</defs></svg>
<main id="app"></main>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script src="data.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const IV=[0,1,3,7,16,35],MASTER=3;
const dayNum=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)};
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const DECK=Object.fromEntries(DECKS.map(d=>[d.id,d]));
const POOL=DECKS.filter(d=>d.exam>0);

/* ---------- storage ---------- */
const NS="hamdrill:";
const get=(k,f)=>{try{const v=localStorage.getItem(NS+k);return v==null?f:JSON.parse(v)}catch(e){return f}};
const put=(k,v)=>{try{localStorage.setItem(NS+k,JSON.stringify(v))}catch(e){toast("Couldn't save progress on this device.")}};
const SRS={};
const srsOf=id=>SRS[id]||(SRS[id]=get("srs:"+id,{}));
const saveSrs=id=>put("srs:"+id,SRS[id]);
function mergeSrs(a,b){const o={...a};for(const k in b){const x=o[k],y=b[k];if(!y)continue;const lx=x?(x.last??-1):-2,ly=y.last??-1;if(!x||ly>lx||(ly===lx&&(y.n||0)>(x.n||0)))o[k]=y}return o}
function importDecks(decks){let n=0;for(const id in decks){if(!DECK[id])continue;SRS[id]=mergeSrs(srsOf(id),decks[id]||{});saveSrs(id);n++}return n}
const APP_VERSION="7";
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

const itemIds=d=>d.S?d.S.map(s=>s.n):d.Q.map(q=>q[0]);
const isDue=(id,k)=>{const r=srsOf(id)[k];return !r||r.due<=dayNum()};
const isMastered=(id,k)=>{const r=srsOf(id)[k];return !!r&&r.lv>=MASTER};
const isSeen=(id,k)=>!!srsOf(id)[k];
function record(id,k,ok){
  const s=srsOf(id),t=dayNum(),r={...(s[k]||{lv:0,due:t,last:null,fail:null})};
  if(!ok){r.lv=0;r.due=t;r.fail=t}
  else if(r.fail===t){r.lv=0;r.due=t+1}
  else if(r.last!==t){r.lv=Math.min(r.lv+1,IV.length-1);r.due=t+capInterval(IV[r.lv],t)}
  r.last=t;r.n=(r.n||0)+1;if(!ok)r.w=(r.w||0)+1;r.ts=Date.now();s[k]=r;saveSrs(id);
  if(ok)awardBadges(DECK[id]);
}
function stats(d){const ids=itemIds(d),t=dayNum();
  return{total:ids.length,due:ids.filter(k=>isDue(d.id,k)).length,seen:ids.filter(k=>isSeen(d.id,k)).length,
    mastered:ids.filter(k=>isMastered(d.id,k)).length,tomorrow:ids.filter(k=>{const r=srsOf(d.id)[k];return r&&r.due===t+1}).length}}
/* An unseen card counts as due, so untouched decks would swamp the home count. Home counts reviews only. */
const reviewsDue=d=>itemIds(d).filter(k=>isSeen(d.id,k)&&isDue(d.id,k)).length;

/* ---------- exam date (optional) ----------
   With a date set, intervals are capped so nothing is scheduled past the exam, and inside the last week
   a card comes back at least once more. Without a date, intervals are the plain IV table. */
const EXAM={day:get("examDay",null)};
const daysToExam=(t=dayNum())=>EXAM.day==null?null:EXAM.day-t;
function capInterval(iv,t){const D=daysToExam(t);if(D==null||D<=0)return iv;let cap=Math.max(1,D-1);if(D<=7)cap=Math.min(cap,Math.max(1,Math.floor(D/2)));return Math.min(iv,cap)}
function setExamDay(day){EXAM.day=day;if(day==null)localStorage.removeItem(NS+"examDay");else put("examDay",day)}
const isoToDay=iso=>{const [y,m,d]=iso.split("-").map(Number);return Math.floor(Date.UTC(y,m-1,d)/86400000)};
const dayToIso=day=>new Date(day*86400000).toISOString().slice(0,10);
const dayLabel=day=>new Date(day*86400000).toLocaleDateString(undefined,{timeZone:"UTC",weekday:"short",month:"short",day:"numeric"});

/* ---------- estimated score ----------
   Expected correct per section = its exam count times a weighted share of cards by state. Two weightings
   give a low and a high. Math and symbols are not exam sections; their questions already sit in T5 etc. */
const EST_W={lo:{m:.9,k:.55,s:.35,u:.25},hi:{m:1,k:.85,s:.65,u:.25}};
function sectionShare(d,w){const srs=srsOf(d.id);let acc=0;for(const k of itemIds(d)){const r=srs[k];acc+=!r?w.u:r.lv>=MASTER?w.m:r.lv>=1?w.k:w.s}return acc/itemIds(d).length}
function estimate(){let lo=0,hi=0;const gain=[];for(const d of POOL){const l=d.exam*sectionShare(d,EST_W.lo),h=d.exam*sectionShare(d,EST_W.hi);lo+=l;hi+=h;gain.push([d,d.exam-(l+h)/2])}
  gain.sort((a,b)=>b[1]-a[1]);return{lo:Math.round(lo),hi:Math.round(hi),gain:gain.filter(g=>g[1]>=0.75).slice(0,2).map(g=>g[0].code)}}

/* ---------- badges ----------
   Three rungs per deck, judged on every card: bronze = all seen, silver = all answered correctly at least
   once (no card sitting at level 0), gold = all mastered. A rung, once earned, is kept with the day it was
   earned; the badge dims while the deck's current standing is below its best rung. */
const TIER=["","Bronze","Silver","Gold"],TIER_WHY=["","every card seen","every card answered correctly","every card mastered"];
const BADGES=get("badges",{});
const saveBadges=()=>put("badges",BADGES);
function tierNow(d){const s=srsOf(d.id);let t=3;for(const k of itemIds(d)){const r=s[k];if(!r)return 0;if(r.lv<1)t=Math.min(t,1);else if(r.lv<MASTER)t=Math.min(t,2)}return t}
const tierEarned=d=>{const b=BADGES[d.id]||{};return b[3]?3:b[2]?2:b[1]?1:0};
function awardBadges(d,quiet){
  const now=tierNow(d),b=BADGES[d.id]||(BADGES[d.id]={});let top=0;
  for(let t=1;t<=now;t++)if(!b[t]){b[t]=dayNum();top=t}
  if(top){saveBadges();if(!quiet)toast(`${TIER[top]} badge: ${d.code} ${d.name}. ${TIER_WHY[top][0].toUpperCase()+TIER_WHY[top].slice(1)}.`)}

}
function mergeBadges(src){if(!src)return;for(const id in src){if(!DECK[id])continue;const b=BADGES[id]||(BADGES[id]={});for(const t of [1,2,3]){const v=src[id][t];if(v&&(!b[t]||v<b[t]))b[t]=v}}saveBadges()}
DECKS.forEach(d=>awardBadges(d,true));
function badgeSvg(tier,size,{lapsed=false,full=false}={}){
  const arcs=['','<use href="#arc1"/>','<use href="#arc1"/><use href="#arc2"/>','<use href="#arc1"/><use href="#arc2"/><use href="#arc3"/><use href="#waves"/>'][tier];
  return `<svg class="badge t${tier}${lapsed?" lapsed":""}" width="${size}" height="${size}" viewBox="0 -4 64 80" aria-hidden="true"><circle class="ring" cx="32" cy="42" r="30"/><use class="tw" href="#tower"/>${full?'<use class="tw" href="#towerx"/>':""}${arcs}</svg>`;
}
const deckBadge=(d,size,full)=>{const e=tierEarned(d);return badgeSvg(e,size,{lapsed:e>0&&tierNow(d)<e,full})};

/* Shuffle and basics choices persist; Due today resets to on each time a deck opens, so one practice run never leaks into the next review. */
const prefs=Object.assign({shuffleQ:true,shuffleA:true,basics:false,showEst:true,showDate:false},get("prefs",{}));prefs.dueOnly=true;

function toast(msg){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ---------- router ---------- */
function route(){
  const h=location.hash.slice(1);
  const m=h.match(/^([a-z0-9]+)\/(study|p)(?:\/([a-z0-9_-]+))?$/);
  if(h==="due")drill({mixed:true});
  else if(h==="study")study(null);
  else if(h==="about")about();
  else if(m&&DECK[m[1]]&&m[2]==="study")study(DECK[m[1]]);
  else if(m&&DECK[m[1]]&&m[2]==="p"&&DECK[m[1]].P&&DECK[m[1]].P[m[3]])drill({deck:DECK[m[1]],primer:m[3]});
  else if(h==="symbols")symbols();

function planBlock(){

function sashCaption(){

/* ---------- question drills ---------- */
function drill({deck,mixed,primer}){
  const app=$("app");prefs.dueOnly=!primer;
  const decks=mixed?POOL:[deck];
  const all=decks.flatMap(d=>d.Q.map(q=>({d,q})));
  const grpOf=(d,id)=>d.id==="math"?(["T5B","T5C","T5D"].includes(id.slice(0,3))?id.slice(0,3):"X"):id.slice(0,3);
  let group="all",items=[],i=0,done=0,fr=0,fd=0,shown=null;
  const title=mixed?"Everything due":deck.id==="math"?deck.name:`${deck.code}: ${deck.name}`;
  const sub=mixed?"Every pool question due today, mixed across sections. Math and symbols stay in their own decks.":
    deck.id==="math"?"Every math question in the pool, with a worked solution after each answer.":`All ${deck.Q.length} ${deck.code} questions, worded as on the exam. ${deck.code} supplies ${deck.exam} of your 35 exam questions.`;
  const chips=mixed||primer?[]:[["all",`All ${deck.Q.length}`],...Object.keys(deck.G).map(g=>[g,g==="X"?"Other":g])];
  app.innerHTML=`<button class="back" id="back">&larr; All decks</button>
  <h1>${title}</h1>${mixed?`<p class="sub">${sub}</p>`:""}
  ${primer?`<p class="only">Drilling the ${deck.Q.filter(q=>deck.CON[q[0]]===primer).length} questions under <b>${esc(deck.P[primer][0])}</b>, due or not. <a href="#${deck.id}/study">Back to the ${deck.code} study page</a>.</p>`:""}
  ${!mixed&&deck.cheat?`<details class="cheat"><summary>Cheat sheet</summary>${deck.cheat}</details>`:""}
  ${!mixed&&deck.P&&!primer?`<p class="tools"><a href="#${deck.id}/study">Read the ${deck.code} basics</a></p>`:""}
  ${chips.length?`<div class="groups" id="groups" role="group" aria-label="Question group">${chips.map(([v,l])=>`<button class="chip" data-v="${v}" aria-pressed="${v===group}">${l}</button>`).join("")}</div>`:""}
  <details class="optsbox"><summary id="optsum"></summary><div class="opts">
    <label><input type="checkbox" id="shuffleQ"> Shuffle questions</label>
    <label><input type="checkbox" id="shuffleA"> Shuffle answers</label>
    ${mixed?"":`<label><input type="checkbox" id="basics"> Basics first</label>`}
    ${mixed?"":`<label><input type="checkbox" id="dueOnly"> Due today</label>`}
  </div></details>
  <p class="srs" id="srsline"></p>
  <div class="status"><span id="pos"></span><span id="score"></span></div>
  <div class="bar"><span id="fill"></span></div>
  <div class="card" id="card" aria-live="polite"></div>
  ${mixed?"":`<p class="foot"><button class="linkbtn" id="reset">Reset ${deck.code} progress</button></p>`}`;
  $("back").onclick=goHome;
  const opt=k=>mixed&&k==="basics"?false:mixed&&k==="dueOnly"?true:prefs[k];
  const optSummary=()=>{const on=[];if(opt("dueOnly"))on.push("due today");if(opt("shuffleQ"))on.push("shuffled");if(opt("shuffleA"))on.push("answers shuffled");if(opt("basics"))on.push("basics first");$("optsum").textContent="Options: "+(on.length?on.join(", "):"none")};
  ["shuffleQ","shuffleA","basics","dueOnly"].forEach(k=>{const el=$(k);if(!el)return;el.checked=prefs[k];el.onchange=()=>{prefs[k]=el.checked;savePrefs();optSummary();k==="shuffleA"?render():start()}});
  optSummary();
  if($("groups"))$("groups").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{group=b.dataset.v;$("groups").querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));start()});
  if($("reset"))$("reset").onclick=function(){if(this.dataset.armed){SRS[deck.id]={};saveSrs(deck.id);delete this.dataset.armed;this.textContent="Progress reset";start()}else{this.dataset.armed="1";this.textContent="Tap again to erase all "+deck.code+" progress"}};

  const inGroup=()=>all.filter(x=>primer?deck.CON[x.q[0]]===primer:(group==="all"||grpOf(x.d,x.q[0])===group));
  const due=x=>mixed?(isSeen(x.d.id,x.q[0])&&isDue(x.d.id,x.q[0])):isDue(x.d.id,x.q[0]);
  function srsLine(){
    const g=inGroup(),t=dayNum();
    const n=g.filter(due).length,m=g.filter(x=>isMastered(x.d.id,x.q[0])).length,tom=g.filter(x=>{const r=srsOf(x.d.id)[x.q[0]];return r&&r.due===t+1}).length;
    $("srsline").textContent=mixed?`${n} due today${tom?`, ${tom} coming up tomorrow`:""}.`:`${n} due today, ${m} of ${g.length} mastered${tom?`, ${tom} coming up tomorrow`:""}.`;
  }
  function start(){
    let pool=inGroup();
    if(opt("dueOnly"))pool=pool.filter(due);
    items=opt("shuffleQ")?shuffle(pool):pool;
    if(opt("basics")){const ord=Object.keys(deck.P);items=ord.flatMap(k=>items.filter(x=>deck.CON[x.q[0]]===k)).concat(items.filter(x=>!deck.CON[x.q[0]]))}
    shown=null;i=0;done=0;fr=0;fd=0;render();
  }
  function status(){

    $("pos").textContent=items.length?`Question ${Math.min(i+1,items.length)} of ${items.length}`:"";
    $("score").textContent=fd?`${fr} of ${fd} right first try`:"";
    $("fill").style.width=items.length?(done/items.length*100)+"%":"0";
  }
  function render(){
    status();const c=$("card");
    if(!items.length){c.innerHTML=opt("dueOnly")?`<p class="q">Nothing is due here today.</p><p>Spacing works best when cards rest. Come back tomorrow, or turn off Due today to practice anyway.</p>`:`<p class="q">No questions match.</p>`;return}
    if(i>=items.length){
      const pct=Math.round(fr/Math.max(fd,1)*100),left=inGroup().filter(due).length,t=dayNum();
      const tom=inGroup().filter(x=>{const r=srsOf(x.d.id)[x.q[0]];return r&&r.due===t+1}).length;
      c.innerHTML=`<div class="end"><h2>${fr}/${fd}</h2><p>${pct}% right on the first try. The exam pass mark is 74%.</p>${opt("dueOnly")?`<p>${left?`${left} more ${left===1?"question is":"questions are"} due today.`:"That's everything due today."} ${tom} will be back tomorrow.</p>`:""}</div>
      <div class="actions"><button class="btn" id="home">Back to all decks</button><button class="btn ghost" id="again">Start over</button></div>`;
      $("home").onclick=goHome;$("again").onclick=start;return;
    }
    const {d,q}=items[i];
    if(opt("basics")&&deck.CON[q[0]]&&deck.CON[q[0]]!==shown){
      const k=deck.CON[q[0]],[t,b]=deck.P[k];let n=0;while(i+n<items.length&&deck.CON[items[i+n].q[0]]===k)n++;
      c.innerHTML=`<p class="topic">Basics</p><h2 class="ptitle">${t}</h2><div class="primer">${b}</div><p class="topic">Covers the next ${n===1?"question":n+" questions"}. <a href="#${deck.id}/study" style="color:inherit">Read all of ${deck.code}'s basics</a>.</p><div class="actions"><button class="btn" id="go">Show the question</button></div>`;
      $("go").onclick=()=>{shown=k;render()};$("go").focus({preventScroll:true});return;
    }
    const [id,text,opts,ans,note,fig]=q;
    const hasAll=opts.some(o=>/^All these/.test(o));
    const order=opt("shuffleA")&&!hasAll?shuffle([0,1,2,3]):[0,1,2,3];
    c.innerHTML=`<p class="topic"><span class="qid">${id}</span>${esc(d.G[grpOf(d,id)]||d.name)}</p>
      ${fig?`<p class="fig">Uses figure ${fig} from the pool.</p>`:""}
      <p class="q">${text}</p><div class="ans" id="ans"></div><div id="after"></div>`;
    order.forEach((oi,pos)=>{const b=document.createElement("button");b.innerHTML=`<b>${"ABCD"[pos]}</b><span>${opts[oi]}</span>`;b.dataset.oi=oi;b.onclick=()=>pick(oi);$("ans").appendChild(b)});
    $("ans").firstChild.focus({preventScroll:true});
  }
  function pick(oi){
    const {d,q}=items[i],[id,,,ans,note]=q,ok=oi===ans;
    [...$("ans").children].forEach(b=>{b.disabled=true;const v=+b.dataset.oi;if(v===ans)b.classList.add("right");else if(v===oi)b.classList.add("wrong")});
    done++;if(!items[i].re){fd++;if(ok)fr++}
    record(d.id,id,ok);
    if(!ok&&opt("dueOnly")){items.splice(Math.min(i+4,items.length),0,{...items[i],re:1})}
    status();
    const F=d.F&&d.F[id],ex=EXPLAIN[id],ck=d.CON&&d.CON[id],pr=ck&&d.P[ck];
    $("after").innerHTML=`<p class="note"><strong class="${ok?"ok":"no"}">${ok?"Correct.":"Not quite."}</strong> ${note}</p>
      ${F?`<div class="fx"><p class="eq">${F[0]}</p><ul class="leg">${F[1].map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}
      <div class="actions"><button class="btn" id="next">${i+1<items.length?"Next question":"See results"}</button>${ex?`<button class="btn ghost" id="more" aria-expanded="false">Explain this more</button>`:""}</div>
      <div class="explain" id="exbox" hidden>${ex?ex.split(/\n\s*\n/).map(p=>`<p>${esc(p)}</p>`).join(""):""}
      ${pr?`<details><summary>Basics: ${pr[0]}</summary>${pr[1]}</details>`:""}</div>`;
    $("next").onclick=()=>{i++;render()};
    if($("more"))$("more").onclick=function(){const box=$("exbox"),open=box.hidden;box.hidden=!open;this.setAttribute("aria-expanded",open);this.textContent=open?"Hide explanation":"Explain this more"};
    $("next").focus({preventScroll:true});
  }
  start();
}

/* ---------- symbol drill ---------- */
function symbols(){
  const d=DECK.symbols,S=d.S,app=$("app");prefs.dueOnly=true;
  const SW='stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"';
  const svg=s=>`<svg viewBox="0 0 120 60" role="img" aria-label="Schematic symbol"><g ${SW}>${s.d}</g></svg>`;
  let mode="name",items=[],i=0,done=0,fr=0,fd=0;
  app.innerHTML=`<button class="back" id="back">&larr; All decks</button>
  <h1>Symbol drill</h1><p class="sub">Twenty-one symbols drawn to match the three pool figures, plus the look-alikes the pool uses as wrong answers.</p>
  <div class="groups" id="modes" role="group" aria-label="Drill mode">${[["name","Name the symbol"],["find","Find the symbol"],["mix","Mixed"]].map(([v,l])=>`<button class="chip" data-v="${v}" aria-pressed="${v===mode}">${l}</button>`).join("")}</div>
  <div class="opts"><label><input type="checkbox" id="dueOnly"> Due today</label></div>
  <p class="srs" id="srsline"></p>
  <div class="status"><span id="pos"></span><span id="score"></span></div>
  <div class="bar"><span id="fill"></span></div>
  <div class="card" id="card" aria-live="polite"></div>
  <p class="foot"><button class="linkbtn" id="reset">Reset symbol progress</button></p>`;
  $("back").onclick=goHome;
  $("dueOnly").checked=prefs.dueOnly;$("dueOnly").onchange=()=>{prefs.dueOnly=$("dueOnly").checked;savePrefs();start()};
  $("modes").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{mode=b.dataset.v;$("modes").querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));start()});
  $("reset").onclick=function(){if(this.dataset.armed){SRS.symbols={};saveSrs("symbols");delete this.dataset.armed;this.textContent="Progress reset";start()}else{this.dataset.armed="1";this.textContent="Tap again to erase all symbol progress"}};
  const due=s=>isDue("symbols",s.n);
  const tomorrow=()=>S.filter(s=>{const r=srsOf("symbols")[s.n];return r&&r.due===dayNum()+1}).length;
  function srsLine(){$("srsline").textContent=`${S.filter(due).length} due today, ${S.filter(s=>isMastered("symbols",s.n)).length} of ${S.length} mastered${tomorrow()?`, ${tomorrow()} coming up tomorrow`:""}.`}
  function choices(s){const same=shuffle(S.filter(x=>x!==s&&x.f===s.f)),rest=shuffle(S.filter(x=>x!==s&&x.f!==s.f));return shuffle([s,...same.concat(rest).slice(0,3)])}
  function start(){const pool=prefs.dueOnly?S.filter(due):S;items=shuffle(pool).map(s=>({s,m:mode==="mix"?(Math.random()<.5?"name":"find"):mode}));i=0;done=0;fr=0;fd=0;render()}
  function status(){srsLine();$("pos").textContent=items.length?`Symbol ${Math.min(i+1,items.length)} of ${items.length}`:"";$("score").textContent=fd?`${fr} of ${fd} right first try`:"";$("fill").style.width=items.length?(done/items.length*100)+"%":"0"}
  function render(){
    status();const c=$("card");
    if(!items.length){c.innerHTML=`<p class="q">Nothing is due here today.</p><p>Come back tomorrow, or turn off Due today to practice anyway.</p>`;return}
    if(i>=items.length){const left=S.filter(due).length;
      c.innerHTML=`<div class="end"><h2>${fr}/${fd}</h2><p>${Math.round(fr/Math.max(fd,1)*100)}% right on the first try.</p>${prefs.dueOnly?`<p>${left?`${left} more ${left===1?"symbol is":"symbols are"} due today.`:"That's everything due today."} ${tomorrow()} will be back tomorrow.</p>`:""}</div>
      <div class="actions"><button class="btn" id="home">Back to all decks</button><button class="btn ghost" id="again">Start over</button></div>`;
      $("home").onclick=goHome;$("again").onclick=start;return}
    const {s,m}=items[i],opts=choices(s);
    if(m==="name"){c.innerHTML=`<p class="prompt">What is this symbol?</p><div class="big">${svg(s)}</div><div class="ans" id="ans"></div><div id="after"></div>`;
      opts.forEach(o=>{const b=document.createElement("button");b.textContent=o.n;b.dataset.n=o.n;b.onclick=()=>pick(o,s);$("ans").appendChild(b)})}
    else{c.innerHTML=`<p class="prompt">Tap the symbol for</p><p class="name">${esc(s.n)}</p><div class="ans tiles" id="ans"></div><div id="after"></div>`;
      opts.forEach((o,k)=>{const b=document.createElement("button");b.innerHTML=svg(o);b.dataset.n=o.n;b.setAttribute("aria-label","Option "+"ABCD"[k]);b.onclick=()=>pick(o,s);$("ans").appendChild(b)})}
    $("ans").firstChild.focus({preventScroll:true});
  }
  function pick(o,s){
    const ok=o===s;
    [...$("ans").children].forEach(b=>{b.disabled=true;if(b.dataset.n===s.n)b.classList.add("right");else if(b.dataset.n===o.n)b.classList.add("wrong")});
    done++;if(!items[i].re){fd++;if(ok)fr++}record("symbols",s.n,ok);
    if(!ok&&prefs.dueOnly)items.splice(Math.min(i+4,items.length),0,{...items[i],re:1});
    status();
    $("after").innerHTML=`<div class="note"><p class="defn"><strong class="${ok?"ok":"no"}">${ok?"Correct.":"Not quite."}</strong> <b>${esc(s.n)}</b>: ${s.def}</p><p class="hook">How to spot it: ${s.t}</p></div><div class="actions"><button class="btn" id="next">${i+1<items.length?"Next symbol":"See results"}</button></div>`;
    $("next").onclick=()=>{i++;render()};$("next").focus({preventScroll:true});
  }
  start();
}

route();
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had)toast("Updated. Close and reopen the app to use the new version.")});
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
