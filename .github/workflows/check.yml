name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Question data
        run: |
          node tools/pool-check.js technician
          node tools/pool-check.js general
          node tools/data-format.js --check technician/data.js general/data.js
      - name: Tests
        run: node --test "test/*.test.js"
