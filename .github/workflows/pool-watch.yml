name: pool watch
# Downloads each official pool from the NCVEC and compares it with the committed snapshot in pools/, so a new
# errata release shows up as a failed run whose log says what changed. The NCVEC's site sits behind Cloudflare,
# which answers GitHub's runners with 403 (October 2026), so this is not scheduled: run tools/pool-fetch.js by
# hand instead, and try this by hand now and then in case the block lifts. After a change: download the new file,
# run tools/pool-snapshot.js, fix data.js until tools/pool-check.js passes.
on:
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Both pools
        run: node tools/pool-fetch.js
