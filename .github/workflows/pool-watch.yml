name: pool watch
# Once a week, download each official pool from the NCVEC and compare it with the committed snapshot in pools/.
# A new errata release shows up as a failed run, which GitHub mails to the repository owner; the log says what
# changed. Then: download the new file, run tools/pool-snapshot.js, fix data.js until tools/pool-check.js passes.
on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Technician pool
        run: node tools/pool-fetch.js technician
      - name: General pool
        if: always()
        run: node tools/pool-fetch.js general
