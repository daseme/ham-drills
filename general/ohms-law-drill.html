<script>
const pick = a => a[Math.floor(Math.random() * a.length)];
const n = x => (+(+x).toFixed(6)).toLocaleString('en-US', { maximumFractionDigits: 6 });

const Is = [0.5, 1, 1.5, 2, 2.5, 3, 4, 5];
const Rs = [4, 5, 6, 8, 10, 12, 20, 25, 50, 100];

const R_ = (rule, calc) => ({ rule, calc });
const H_ = head => ({ head });
const N_ = note => ({ note });
/* A wrong answer a common mistake gives, and what to say when it is the one typed. */
const W_ = (v, note) => [v, note];

const gens = {
  ohmV() {
    const I = pick(Is), R = pick(Rs), V = I * R;
    return { given: { I: n(I) + ' A', R: n(R) + ' Ω' }, unknown: 'V', unit: 'V', ans: V,
      q: `${n(I)} A flows through a ${n(R)} Ω resistor. What is the voltage across it?`,
      wrong: [W_(I / R, 'That is I ÷ R. Voltage is current times resistance: V = I × R.'),
        W_(R / I, 'That is R ÷ I. Voltage is current times resistance: V = I × R.')],
      steps: [R_('Voltage equals current times resistance.', `V = I × R = ${n(I)} × ${n(R)} = ${n(V)} V`)] };
  },
  ohmI() {
    const I = pick(Is), R = pick(Rs), V = I * R;
    return { given: { V: n(V) + ' V', R: n(R) + ' Ω' }, unknown: 'I', unit: 'A', ans: I,
      q: `${n(V)} V is across a ${n(R)} Ω resistor. How much current flows?`,
      wrong: [W_(V * R, 'That is V × R. Current is voltage divided by resistance: I = V ÷ R.'),
        W_(R / V, 'That is R ÷ V, the division upside down. Current is I = V ÷ R.')],
      steps: [R_('Current equals voltage divided by resistance.', `I = V ÷ R = ${n(V)} ÷ ${n(R)} = ${n(I)} A`)] };
  },
  ohmR() {
    const I = pick(Is), R = pick(Rs), V = I * R;
    return { given: { V: n(V) + ' V', I: n(I) + ' A' }, unknown: 'R', unit: 'Ω', ans: R,
      q: `A resistor draws ${n(I)} A from a ${n(V)} V supply. What is its resistance?`,
      wrong: [W_(V * I, 'That is V × I, which is the power in watts. Resistance is R = V ÷ I.'),
        W_(I / V, 'That is I ÷ V, the division upside down. Resistance is R = V ÷ I.')],
      steps: [R_('Resistance equals voltage divided by current.', `R = V ÷ I = ${n(V)} ÷ ${n(I)} = ${n(R)} Ω`)] };
  },
  pVI() {
    const V = pick([5, 6, 9, 12, 13.8, 24, 48, 120]), I = pick([0.5, 1, 2, 2.5, 3, 4, 5, 10]), P = V * I;
    return { given: { V: n(V) + ' V', I: n(I) + ' A' }, unknown: 'P', unit: 'W', ans: P,
      q: `A radio draws ${n(I)} A from a ${n(V)} V supply. How much power does it use?`,
      wrong: [W_(V / I, 'That is V ÷ I, which is the resistance. Power is voltage times current: P = V × I.'),
        W_(I / V, 'That is I ÷ V. Power is voltage times current: P = V × I.')],
      steps: [R_('Power equals voltage times current.', `P = V × I = ${n(V)} × ${n(I)} = ${n(P)} W`)] };
  },
  pVR() {
    const I = pick(Is), R = pick(Rs), V = I * R, P = V * V / R;
    return { given: { V: n(V) + ' V', R: n(R) + ' Ω' }, unknown: 'P', unit: 'W', ans: P,
      q: `${n(V)} V is across a ${n(R)} Ω resistor. How much power does it dissipate?`,
      wrong: [W_(V / R, 'That is V ÷ R, which is the current in amps. Power is V² ÷ R: square the voltage first.'),
        W_(V * V, 'That is V² without dividing by R. Power is V² ÷ R.'),
        W_(2 * V / R, 'That doubles V instead of squaring it. V² means V × V.'),
        W_(V * R, 'That is V × R. Power is V² ÷ R.')],
      steps: [
        H_('Short way'),
        R_('Power equals voltage squared divided by resistance.', `P = V² ÷ R = ${n(V)}² ÷ ${n(R)} = ${n(V * V)} ÷ ${n(R)} = ${n(P)} W`),
        H_('Long way'),
        R_('First find the current. Current equals voltage divided by resistance.', `I = V ÷ R = ${n(V)} ÷ ${n(R)} = ${n(I)} A`),
        R_('Then power equals voltage times current.', `P = V × I = ${n(V)} × ${n(I)} = ${n(P)} W`)] };
  },
  pIR() {
    const I = pick(Is), R = pick(Rs), P = I * I * R, V = I * R;
    return { given: { I: n(I) + ' A', R: n(R) + ' Ω' }, unknown: 'P', unit: 'W', ans: P,
      q: `${n(I)} A flows through a ${n(R)} Ω resistor. How much power does it dissipate?`,
      wrong: [W_(I * R, 'That is I × R, which is the voltage. Power is I² × R: square the current first.'),
        W_(I * I, 'That is I² without multiplying by R. Power is I² × R.'),
        W_(2 * I * R, 'That doubles I instead of squaring it. I² means I × I.'),
        W_(I * I / R, 'That is I² ÷ R. Power is I² × R: multiply by the resistance.')],
      steps: [
        H_('Short way'),
        R_('Power equals current squared times resistance.', `P = I² × R = ${n(I)}² × ${n(R)} = ${n(I * I)} × ${n(R)} = ${n(P)} W`),
        H_('Long way'),
        R_('First find the voltage. Voltage equals current times resistance.', `V = I × R = ${n(I)} × ${n(R)} = ${n(V)} V`),
        R_('Then power equals voltage times current.', `P = V × I = ${n(V)} × ${n(I)} = ${n(P)} W`)] };
  },
  iPV() {
    const V = pick([12, 13.8, 24, 120]), I = pick([0.5, 1, 2, 2.5, 5, 10]), P = V * I;
    return { given: { V: n(V) + ' V', P: n(P) + ' W' }, unknown: 'I', unit: 'A', ans: I,
      q: `A ${n(P)} W load runs on ${n(V)} V. How much current does it draw?`,
      wrong: [W_(P * V, 'That is P × V. Current is power divided by voltage: I = P ÷ V.'),
        W_(V / P, 'That is V ÷ P, the division upside down. Current is I = P ÷ V.')],
      steps: [R_('Power equals voltage times current, so current equals power divided by voltage.', `I = P ÷ V = ${n(P)} ÷ ${n(V)} = ${n(I)} A`)] };
  },
  kV() {
    const mA = pick([1, 2, 4, 5, 10, 20, 25]), k = pick([0.5, 1, 2, 4, 5, 10]), V = mA * k, A = mA / 1000, R = k * 1000;
    return { given: { I: n(mA) + ' mA', R: n(k) + ' kΩ' }, unknown: 'V', unit: 'V', ans: V,
      q: `${n(mA)} mA flows through a ${n(k)} kΩ resistor. What is the voltage across it?`,
      wrong: [W_(mA / k, 'That is I ÷ R. Voltage is current times resistance: V = I × R.'),
        W_(k / mA, 'That is R ÷ I. Voltage is current times resistance: V = I × R.')],
      steps: [
        R_('Convert to amps and ohms first. Divide milliamps by 1,000; multiply kilohms by 1,000.', `${n(mA)} mA = ${n(A)} A, and ${n(k)} kΩ = ${n(R)} Ω`),
        R_('Voltage equals current times resistance.', `V = I × R = ${n(A)} × ${n(R)} = ${n(V)} V`),
        N_('Shortcut: milliamps times kilohms gives volts directly, because the thousands cancel.')] };
  },
  kI() {
    const mA = pick([1, 2, 4, 5, 10, 20, 25]), k = pick([0.5, 1, 2, 4, 5, 10]), V = mA * k, A = mA / 1000, R = k * 1000;
    return { given: { V: n(V) + ' V', R: n(k) + ' kΩ' }, unknown: 'I', unit: 'mA', ans: mA,
      q: `${n(V)} V is across a ${n(k)} kΩ resistor. How many milliamps flow?`,
      wrong: [W_(V * k, 'That is V × R. Current is voltage divided by resistance: I = V ÷ R.'),
        W_(k / V, 'That is R ÷ V, the division upside down. Current is I = V ÷ R.')],
      steps: [
        R_('Convert to ohms first. Multiply kilohms by 1,000.', `${n(k)} kΩ = ${n(R)} Ω`),
        R_('Current equals voltage divided by resistance.', `I = V ÷ R = ${n(V)} ÷ ${n(R)} = ${n(A)} A`),
        R_('Convert to milliamps. Multiply amps by 1,000.', `${n(A)} A = ${n(mA)} mA`),
        N_('Shortcut: volts divided by kilohms gives milliamps directly.')] };
  },
  kP() {
    const mA = pick([2, 4, 5, 10]), k = pick([0.5, 1, 2, 5]), V = mA * k, R = k * 1000, A = mA / 1000, W = V * V / R;
    return { given: { V: n(V) + ' V', R: n(k) + ' kΩ' }, unknown: 'P', unit: 'mW', ans: W * 1000,
      q: `${n(V)} V is across a ${n(k)} kΩ resistor. How many milliwatts does it dissipate?`,
      wrong: [W_(V / k, 'That is V ÷ R, which is the current (in milliamps). Power is V² ÷ R: square the voltage first.'),
        W_(2 * V / k, 'That doubles V instead of squaring it. V² means V × V.'),
        W_(V * k, 'That is V × R. Power is V² ÷ R.')],
      steps: [
        R_('Convert to ohms first. Multiply kilohms by 1,000.', `${n(k)} kΩ = ${n(R)} Ω`),
        H_('Short way'),
        R_('Power equals voltage squared divided by resistance.', `P = V² ÷ R = ${n(V)}² ÷ ${n(R)} = ${n(V * V)} ÷ ${n(R)} = ${n(W)} W`),
        H_('Long way'),
        R_('First find the current. Current equals voltage divided by resistance.', `I = V ÷ R = ${n(V)} ÷ ${n(R)} = ${n(A)} A`),
        R_('Then power equals voltage times current.', `P = V × I = ${n(V)} × ${n(A)} = ${n(W)} W`),
        H_('Finish'),
        R_('Convert to milliwatts. Multiply watts by 1,000.', `${n(W)} W = ${n(W * 1000)} mW`)] };
  },
  mP() {
    const mA = pick([10, 20, 50]), R = pick([50, 100, 200]), A = mA / 1000, W = A * A * R, V = A * R;
    return { given: { I: n(mA) + ' mA', R: n(R) + ' Ω' }, unknown: 'P', unit: 'mW', ans: W * 1000,
      q: `${n(mA)} mA flows through a ${n(R)} Ω resistor. How many milliwatts does it dissipate?`,
      wrong: [W_(A * R * 1000, 'That is I × R, which is the voltage. Power is I² × R: square the current first.'),
        W_(A * R, 'That is I × R, which is the voltage. Power is I² × R: square the current first.'),
        W_(2 * A * R * 1000, 'That doubles I instead of squaring it. I² means I × I.')],
      steps: [
        R_('Convert to amps first. Divide milliamps by 1,000.', `${n(mA)} mA = ${n(A)} A`),
        H_('Short way'),
        R_('Power equals current squared times resistance.', `P = I² × R = ${n(A)}² × ${n(R)} = ${n(A * A)} × ${n(R)} = ${n(W)} W`),
        H_('Long way'),
        R_('First find the voltage. Voltage equals current times resistance.', `V = I × R = ${n(A)} × ${n(R)} = ${n(V)} V`),
        R_('Then power equals voltage times current.', `P = V × I = ${n(V)} × ${n(A)} = ${n(W)} W`),
        H_('Finish'),
        R_('Convert to milliwatts. Multiply watts by 1,000.', `${n(W)} W = ${n(W * 1000)} mW`)] };
  }
};

const pools = {
  ohm: ['ohmV', 'ohmI', 'ohmR'],
  power: ['pVI', 'pVR', 'pIR', 'iPV'],
  prefix: ['kV', 'kI', 'kP', 'mP']
};
pools.mixed = [...pools.ohm, ...pools.power, ...pools.prefix];

const labels = {
  ohmV: 'Voltage from current and resistance', ohmI: 'Current from voltage and resistance', ohmR: 'Resistance from voltage and current',
  pVI: 'Power from voltage and current', pVR: 'Power from voltage and resistance (V²)', pIR: 'Power from current and resistance (I²)',
  iPV: 'Current from power and voltage', kV: 'Volts from mA and kΩ', kI: 'Milliamps from volts and kΩ',
  kP: 'Milliwatts from volts and kΩ', mP: 'Milliwatts from mA and ohms'
};
const order = pools.mixed;
const statusText = { new: 'New', solid: 'Solid', getting: 'Getting there', weak: 'Needs work' };
/* Stored under General's namespace: every site on daseme.github.io shares one localStorage. */
const WINDOW = 6, LS_KEY = 'hamgeneral:ohms';
let stats = {}, currentType = null, slips = 0;

function mastery(t) {
  const r = (stats[t] && stats[t].recent) || [];
  const ok = r.filter(Boolean).length;
  return { n: r.length, score: (ok + 1) / (r.length + 2) };
}
function status(t) {
  const m = mastery(t);
  if (m.n < 3) return 'new';
  if (m.score >= 0.75) return 'solid';
  if (m.score >= 0.5) return 'getting';
  return 'weak';
}
const isWeak = t => status(t) === 'weak' || status(t) === 'getting';
function weight(t) {
  const m = mastery(t);
  return m.n === 0 ? 1 : 0.15 + (1 - m.score) * 1.5;
}
function choose() {
  if (retry && asked >= retry.at && pools[mode === 'weak' ? 'mixed' : mode].includes(retry.t)) {
    const t = retry.t; retry = null; isRetry = true; return t;
  }
  isRetry = false;
  let pool = pools[mode === 'weak' ? 'mixed' : mode];
  if (mode === 'weak') { const w = pool.filter(isWeak); if (w.length) pool = w; }
  const cands = pool.length > 1 ? pool.filter(t => t !== lastGen) : pool;
  const ws = cands.map(weight);
  let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let i = 0; i < cands.length; i++) { r -= ws[i]; if (r <= 0) return cands[i]; }
  return cands[cands.length - 1];
}
function record(t, ok) {
  const s = stats[t] || (stats[t] = { right: 0, total: 0, recent: [] });
  s.total++; if (ok) s.right++;
  s.recent.push(ok ? 1 : 0);
  if (s.recent.length > WINDOW) s.recent.shift();
  renderProgress();
  save();
}
function renderProgress() {
  document.getElementById('progress').innerHTML = order.map(t => {
    const s = stats[t], st = status(t);
    const dots = (s ? s.recent : []).map(v => `<i class="d ${v ? 'y' : 'x'}"></i>`).join('');
    const tot = s ? `${s.right} of ${s.total} overall` : 'Not tried';
    return `<li class="p ${st}"><span class="pl">${labels[t]}</span><span class="ps">${statusText[st]}</span><span class="dots">${dots}</span><span class="pt">${tot}</span></li>`;
  }).join('');
  document.getElementById('slipcount').textContent = slips
    ? `Decimal-point slips so far: ${slips}. These count as misses, but they usually mean the formula was right and a conversion or decimal went wrong.` : '';
  document.getElementById('pnote').textContent =
    mode === 'weak' && !order.some(isWeak) ? 'No weak spots yet, so this is drawing from everything.' : '';
}
function clean(o) {
  const out = {};
  if (!o || typeof o !== 'object') return out;
  for (const t of order) {
    const s = o[t];
    if (s && Array.isArray(s.recent)) out[t] = { right: +s.right || 0, total: +s.total || 0, recent: s.recent.map(v => v ? 1 : 0).slice(-WINDOW) };
  }
  return out;
}
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ stats, slips })); } catch (e) {}
}
function load() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { const d = JSON.parse(raw); stats = clean(d.stats); slips = +d.slips || 0; } } catch (e) {}
}

let mode = 'mixed', current = null, lastGen = null, answered = false, right = 0, total = 0, streak = 0;
/* A missed kind comes back as the third question after the miss, with new numbers: a try at fixing it while the
   worked solution is fresh, but not straight away. asked counts the questions shown. */
const RETRY_GAP = 3;
let asked = 0, retry = null, isRetry = false;
const $ = id => document.getElementById(id);

function diagram(p) {
  const lab = (k, x, y, anchor) => {
    const unk = p.unknown === k, val = p.given[k];
    if (!unk && !val) return '';
    return `<text x="${x}" y="${y}" text-anchor="${anchor}" class="${unk ? 'unk' : ''}">${k} = ${unk ? '?' : val}</text>`;
  };
  return `<svg class="circuit" viewBox="0 0 340 140" role="img" aria-label="Circuit with a battery and a resistor">
    <path class="w" d="M80 62 V30 H250 V45"/>
    <path class="w" d="M250 95 V110 H80 V74"/>
    <path class="w" d="M66 62 H94"/>
    <path class="w" d="M73 74 H87"/>
    <polyline class="w" points="250,45 260,50 240,58 260,66 240,74 260,82 240,90 250,95"/>
    <path d="M162 25 L172 30 L162 35 Z" fill="var(--wire)"/>
    ${lab('V', 58, 73, 'end')}
    ${lab('I', 166, 18, 'middle')}
    ${lab('R', 272, 64, 'start')}
    ${lab('P', 272, 88, 'start')}
  </svg>`;
}

function next() {
  asked++;
  const g = choose();
  lastGen = g;
  currentType = g;
  current = gens[g]();
  answered = false;
  $('diagram').innerHTML = diagram(current);
  $('again').textContent = isRetry ? 'Another try at the kind you just missed, with new numbers.' : '';
  $('question').textContent = current.q;
  $('unit').textContent = current.unit;
  $('answer').value = '';
  $('answer').disabled = false;
  $('msg').textContent = '';
  $('fb').className = 'fb';
  $('fb').innerHTML = '';
  $('action').textContent = 'Check';
  $('answer').focus();
}

function check() {
  const raw = $('answer').value.replace(/,/g, '').trim();
  const x = parseFloat(raw);
  if (raw === '' || isNaN(x)) { $('msg').textContent = 'Enter a number, like 24 or 0.5.'; return; }
  $('msg').textContent = '';
  const a = current.ans;
  const near = (u, v) => Math.abs(u - v) <= Math.max(0.011, Math.abs(v) * 0.01);
  const ok = near(x, a);
  /* A wrong answer that matches a common mistake is named; otherwise check for a decimal slip. */
  const mistake = ok ? null : (current.wrong || []).find(([v]) => !near(v, a) && near(x, v));
  total++; if (ok) { right++; streak++; } else { streak = 0; }
  const p10 = x !== 0 && a !== 0 && Math.sign(x) === Math.sign(a) ? Math.log10(x / a) : NaN;
  const slip = !ok && !mistake && isFinite(p10) && Math.round(p10) !== 0 && Math.abs(p10 - Math.round(p10)) < 0.005;
  if (slip) slips++;
  record(currentType, ok);
  if (!ok) retry = { t: currentType, at: asked + RETRY_GAP };
  answered = true;
  $('answer').disabled = true;
  const steps = '<div class="steps">' + current.steps.map(s =>
    s.head ? `<p class="shead">${s.head}</p>` :
    s.note ? `<p class="note">${s.note}</p>` :
    `<div class="step${slip && s.rule.startsWith('Convert') ? ' hl' : ''}"><p class="rule">${s.rule}</p><p class="calc">${s.calc}</p></div>`).join('') + '</div>';
  const fb = $('fb');
  if (ok) {
    fb.className = 'fb good';
    fb.innerHTML = `<p class="verdict">${isRetry ? 'Fixed it. ' : ''}Correct: ${n(a)} ${current.unit}</p><details><summary>Show the work</summary>${steps}</details>`;
  } else {
    fb.className = 'fb bad';
    const factor = slip ? n(Math.pow(10, Math.abs(Math.round(p10)))) : '';
    const conv = current.steps.some(s => s.rule && s.rule.startsWith('Convert'));
    const slipNote = slip ? `<p class="slipnote">Your digits are right, but the decimal point is off by a factor of ${factor}. ${conv ? 'That usually means a unit conversion slipped. The conversion steps are highlighted below.' : 'You likely used the right formula. Recheck where the decimal lands in the arithmetic.'}</p>` : '';
    const mistakeNote = mistake ? `<p class="slipnote">${mistake[1]}</p>` : '';
    const back = '<p class="note">This kind comes back in a few questions with new numbers.</p>';
    fb.innerHTML = `<p class="verdict">Not quite. The answer is ${n(a)} ${current.unit}.</p>${mistakeNote}${slipNote}${steps}${back}`;
  }
  $('score').innerHTML = `<b>${right}</b> of ${total} right` + (streak > 1 ? `, streak ${streak}` : '');
  $('action').textContent = 'Next question';
  $('action').focus();
}

$('action').addEventListener('click', () => answered ? next() : check());
$('answer').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && answered && document.activeElement !== $('action')) { e.preventDefault(); next(); }
});
document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => {
  mode = b.dataset.mode;
  isRetry = false;
  document.querySelectorAll('.modes button').forEach(o => o.setAttribute('aria-pressed', o === b ? 'true' : 'false'));
  lastGen = null;
  next();
}));
let resetArmed = false;
$('reset').addEventListener('click', () => {
  if (!resetArmed) { resetArmed = true; $('reset').textContent = 'Tap again to clear'; setTimeout(() => { resetArmed = false; $('reset').textContent = 'Reset'; }, 4000); return; }
  resetArmed = false; $('reset').textContent = 'Reset';
  stats = {}; slips = 0; retry = null; renderProgress(); save();
});
load();
next();
renderProgress();
</script>
</body>
</html>
